# -----------------------------------------------------------------------------
# Embedded ClickHouse + Redis.
#
# They run inside the project for now. When they move to dedicated servers,
# drop this file from the command line and point the app at them with
# CLICKHOUSE_HOST / REDIS_HOST instead.
#
#   local: docker compose -f docker-compose.yml -f docker-compose.embedded.yml \
#                         -f docker-compose.local.yml up -d --build
#   prod : docker compose -f docker-compose.yml -f docker-compose.embedded.yml \
#                         -f docker-compose.prod.yml up -d --build
# -----------------------------------------------------------------------------
services:
  app:
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      REDIS_HOST: ${REDIS_HOST:-redis}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    container_name: monitoring-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    container_name: monitoring-clickhouse
    restart: unless-stopped
    environment:
      TZ: UTC
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-monitoring}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-monitoring}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD-monitoring}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER:-default}\" --password \"$${CLICKHOUSE_PASSWORD:-}\" --query \"SELECT 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  clickhouse-data:
