# -----------------------------------------------------------------------------
# Local overrides: live code + MySQL running inside the project.
# ClickHouse and Redis come from docker-compose.embedded.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.embedded.yml \
#                  -f docker-compose.local.yml up -d --build
# -----------------------------------------------------------------------------
services:
  app:
    volumes:
      # live code reload: www/ is the document root inside the container
      - ./www:/var/www/html
      # composer dependencies kept out of the working copy
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      AUTO_COMPOSER_INSTALL: "true"
      MIGRATE_ON_START: "true"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: monitoring-mysql
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-monitoring}
      MYSQL_USER: ${DB_USERNAME:-monitoring}
      MYSQL_PASSWORD: ${DB_PASSWORD:-monitoring}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  vendor:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.213.77.0/24
