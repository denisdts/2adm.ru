name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/2adm_deploy"
          chmod 600 "$HOME/.ssh/2adm_deploy"

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Validate deploy key
        run: |
          set -euo pipefail
          if ! ssh-keygen -y -f "$HOME/.ssh/2adm_deploy" > /dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY не читается. Нужен приватный ключ без пароля в формате OpenSSH." >&2
            exit 1
          fi
          ssh-keygen -l -f "$HOME/.ssh/2adm_deploy"

      - name: Upload project
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/2adm_deploy" -p "$port" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"

          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '/checker' \
            --exclude 'www/vendor' \
            --exclude 'www/var' \
            -e "ssh -i $HOME/.ssh/2adm_deploy -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/2adm_deploy" -p "$port" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.yml -f docker-compose.embedded.yml -f docker-compose.prod.yml build && docker compose -f docker-compose.yml -f docker-compose.embedded.yml -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"
